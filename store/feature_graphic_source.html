<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Play feature graphic — exactly 1024x500, no transparency.
     Rendered at 2x and downscaled so the type stays crisp. */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    background: #0C0F0A;                     /* AppColors.bg */
    font-family: "Barlow", sans-serif;
    position: relative;
  }

  /* A volt wash behind the mark, so the flat dark ground has some depth
     without competing with the type. */
  .glow {
    position: absolute; left: -140px; top: -170px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,255,0,0.16) 0%,
                                        rgba(212,255,0,0.05) 42%,
                                        rgba(212,255,0,0) 70%);
  }
  /* Pitch hint: two faint verticals, well outside the safe area. */
  .line-r {
    position: absolute; right: 118px; top: 0; bottom: 0; width: 1px;
    background: rgba(241,244,242,0.06);
  }
  .arc {
    position: absolute; right: -95px; top: 130px;
    width: 240px; height: 240px; border-radius: 50%;
    border: 1px solid rgba(241,244,242,0.07);
  }

  .row {
    position: relative; height: 100%;
    display: flex; align-items: center;
    padding: 0 86px;                         /* keeps content off the crop edges */
    gap: 46px;
  }

  /* The client's logo, kept exactly as supplied — navy on its own white
     field — but set in a chip so it reads as the app icon rather than as a
     white hole punched in the layout. */
  .chip {
    width: 188px; height: 188px; flex: 0 0 188px;
    background: #fff; border-radius: 42px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 44px rgba(0,0,0,0.45);
  }
  .chip img { width: 150px; height: 150px; display: block; }

  .copy { flex: 1; min-width: 0; }

  .eyebrow {
    font-family: "Barlow", sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 3.4px;
    color: #D4FF00;                          /* AppColors.primary */
    margin-bottom: 14px; white-space: nowrap;
  }

  h1 {
    font-family: "Barlow Condensed", "Barlow", sans-serif;
    font-weight: 800; font-size: 78px; line-height: 0.92;
    letter-spacing: -0.5px; color: #F1F4F2;  /* AppColors.txt */
    margin: 0 0 16px; text-transform: uppercase;
  }
  h1 .volt { color: #D4FF00; }

  .sub {
    font-size: 19px; font-weight: 500; color: #8B948F;  /* AppColors.dim */
    margin: 0; letter-spacing: 0.1px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="line-r"></div>
  <div class="arc"></div>

  <div class="row">
    <div class="chip"><img src="yno_icon_fg_navy.png" alt=""></div>
    <div class="copy">
      <div class="eyebrow">PLAY &nbsp;·&nbsp; EARN &nbsp;·&nbsp; BE RECOGNISED</div>
      <h1>Log a match<br>Build your <span class="volt">legend</span></h1>
      <p class="sub">Street &amp; amateur football — Dubai</p>
    </div>
  </div>
</body>
</html>
