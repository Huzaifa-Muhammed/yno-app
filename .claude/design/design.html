<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YNÖ — Yalla Nel'ab</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0C0F0A;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── root container ── */
        .yno-root {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: #0C0F0A;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }

        /* ── ambient pitch lines ── */
        .pitch-lines {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 50% 42%, transparent 118px, #D4FF00 119px, transparent 121px),
                linear-gradient(#D4FF00 1px, transparent 1px);
            background-size: 100% 100%, 100% 90px;
            z-index: 0;
        }

        /* ── floating icons ── */
        .float-icon {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        /* ── animations ── */
        @keyframes floaty {
            0% {
                transform: translateY(0px) rotate(-4deg);
            }
            100% {
                transform: translateY(-14px) rotate(5deg);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 24px rgba(212, 255, 0, 0.25);
            }
            50% {
                box-shadow: 0 0 44px rgba(212, 255, 0, 0.5);
            }
        }

        .fade-up {
            animation: fadeUp 0.5s ease both;
        }
        .fade-up-delay-1 {
            animation-delay: 0.05s;
        }
        .fade-up-delay-2 {
            animation-delay: 0.18s;
        }
        .fade-up-delay-3 {
            animation-delay: 0.26s;
        }

        .tap {
            transition: transform 0.12s ease;
            cursor: pointer;
        }
        .tap:active {
            transform: scale(0.96);
        }

        /* ── top bar ── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 18px 0;
            position: relative;
            z-index: 2;
        }

        .profile-avatar {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            background: #161A14;
            border: 2px solid #D4FF00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            color: #D4FF00;
        }

        .right-cluster {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .coin-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #161A14;
            border: 1.5px solid #252B21;
            border-radius: 16px;
            padding: 0 14px;
            height: 46px;
        }
        .coin-pill span:first-child {
            font-size: 17px;
        }
        .coin-pill span:last-child {
            font-weight: 800;
            font-size: 15px;
            color: #D4FF00;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: #161A14;
            border: 1.5px solid #252B21;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
            cursor: pointer;
            transition: transform 0.12s ease;
        }
        .icon-btn:active {
            transform: scale(0.96);
        }

        .bell-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #D4FF00;
            border: 2px solid #0C0F0A;
        }

        .burger-lines {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            height: 100%;
        }
        .burger-lines div {
            height: 2.5px;
            border-radius: 2px;
            background: #fff;
        }

        /* ── centre stage ── */
        .centre-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px 26px 0;
            position: relative;
            z-index: 2;
        }

        /* logo */
        .logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo-main {
            font-size: 84px;
            font-weight: 900;
            letter-spacing: 6px;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 30px rgba(212, 255, 0, 0.35);
            font-family: 'Arial Black', 'Segoe UI', sans-serif;
            display: inline-block;
        }
        .logo-main span {
            color: #D4FF00;
        }
        .logo-sub {
            font-size: 12px;
            letter-spacing: 7px;
            font-weight: 600;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
        }

        .spacer-30 {
            height: 30px;
        }

        /* big play button */
        .btn-play {
            width: 100%;
            max-width: 280px;
            background: #D4FF00;
            border-radius: 22px;
            padding: 18px 16px;
            text-align: center;
            border: 3px solid #D4FF00;
            animation: fadeUp 0.5s 0.18s ease both, pulseGlow 2.6s ease-in-out 1s infinite;
            cursor: pointer;
            transition: transform 0.12s ease;
        }
        .btn-play:active {
            transform: scale(0.96);
        }
        .btn-play .big {
            font-size: 34px;
            font-weight: 900;
            color: #0C0F0A;
            line-height: 1.05;
            font-family: 'Arial Black', sans-serif;
        }
        .btn-play .small {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #0C0F0A;
            margin-top: 3px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        /* two buttons under */
        .action-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
            margin-top: 14px;
        }
        .action-btn {
            flex: 1;
            background: #161A14;
            border: 2px solid #252B21;
            border-radius: 20px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.12s ease;
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .action-btn .icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .action-btn .label {
            font-weight: 800;
            font-size: 15.5px;
        }

        /* ── responsive tweaks ── */
        @media (max-width: 420px) {
            .logo-main {
                font-size: 64px;
                letter-spacing: 4px;
            }
            .btn-play .big {
                font-size: 28px;
            }
            .btn-play .small {
                font-size: 11px;
                letter-spacing: 3px;
            }
            .top-bar {
                padding: 14px 14px 0;
            }
            .profile-avatar {
                width: 44px;
                height: 44px;
                font-size: 15px;
            }
            .coin-pill {
                height: 40px;
                padding: 0 10px;
            }
            .coin-pill span:last-child {
                font-size: 13px;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .centre-stage {
                padding: 50px 18px 0;
            }
        }
    </style>
</head>
<body>

    <div class="yno-root">

        <!-- ambient pitch lines -->
        <div class="pitch-lines"></div>

        <!-- floating footballs & friends -->
        <div class="float-icon" style="top:16%; left:7%; font-size:34px; animation:floaty 2.6s ease-in-out 0s infinite alternate; opacity:0.9;">⚽</div>
        <div class="float-icon" style="top:11%; right:10%; font-size:22px; animation:floaty 3.1s ease-in-out 0.6s infinite alternate; opacity:0.55;">⚽</div>
        <div class="float-icon" style="top:58%; left:5%; font-size:20px; animation:floaty 2.9s ease-in-out 1.1s infinite alternate; opacity:0.4;">⚽</div>
        <div class="float-icon" style="top:52%; right:6%; font-size:30px; animation:floaty 2.4s ease-in-out 0.3s infinite alternate; opacity:0.75;">🥅</div>
        <div class="float-icon" style="bottom:24%; right:14%; font-size:18px; animation:floaty 3.3s ease-in-out 0.9s infinite alternate; opacity:0.45;">👟</div>

        <!-- ─── TOP BAR ─── -->
        <div class="top-bar fade-up">
            <!-- profile -->
            <div class="profile-avatar tap">YY</div>

            <!-- right cluster -->
            <div class="right-cluster">
                <div class="coin-pill tap">
                    <span>🪙</span>
                    <span>400</span>
                </div>
                <div class="icon-btn tap">
                    🔔
                    <div class="bell-dot"></div>
                </div>
                <div class="icon-btn tap">
                    <div class="burger-lines">
                        <div style="width:16px;"></div>
                        <div style="width:11px;"></div>
                        <div style="width:16px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── CENTRE STAGE ─── -->
        <div class="centre-stage">

            <!-- LOGO -->
            <div class="logo fade-up fade-up-delay-1">
                <div class="logo-main">YN<span>O</span></div>
                <div class="logo-sub">Yalla Nel'ab</div>
            </div>

            <div class="spacer-30"></div>

            <!-- BIG PLAY BUTTON -->
            <div class="btn-play">
                <div class="big">يلا نلعب</div>
                <div class="small">Let's Play</div>
            </div>

            <!-- TWO BUTTONS UNDER -->
            <div class="action-row fade-up fade-up-delay-3">
                <div class="action-btn tap">
                    <div class="icon">👥</div>
                    <div class="label">Friends</div>
                </div>
                <div class="action-btn tap">
                    <div class="icon">🛡️</div>
                    <div class="label">My Teams</div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
